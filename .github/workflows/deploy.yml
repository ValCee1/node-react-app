name: Build and Deploy

on:
  push:
    branches:
      - main

# Required for OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

env:
  # Non-sensitive values (GitHub Variables)
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  # Sensitive values (GitHub Secrets)
  ECR_REPO_URL: ${{ secrets.ECR_REPOSITORY_URL }}

  # Constructed from secrets using expression syntax, not shell interpolation
  MONGO_URI: mongodb://${{ secrets.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@mongodb:27017/node-react-starter?authSource=admin

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Slice full SHA to 7 chars for a concise, standard short SHA tag
      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # OIDC-based auth - no static AWS keys needed
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Cache scoped to the backend image specifically
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}/backend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}/backend:latest
          cache-from: type=registry,ref=${{ env.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}/backend:latest
          cache-to: type=inline

      # Cache scoped to the frontend image specifically
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app/client
          file: ./app/client/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}/frontend:latest
          cache-from: type=registry,ref=${{ env.ECR_REPO_URL }}/${{ env.ECR_REPOSITORY }}/frontend:latest
          cache-to: type=inline

  deploy:
    # Only runs after build job completes successfully
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to app directory (repo must be pre-cloned on EC2)
            cd ~/node-react-app

            # Write only the vars the app actually consumes
            # GitHub expressions are interpolated before the script is sent over SSH
            cat <<'EOF' > .env
            MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_USERNAME }}
            MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            MONGODB_URI=mongodb://${{ secrets.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@mongodb:27017/react-node-app?authSource=admin
            NODE_ENV=production
            PUBLIC_URL=${{ secrets.EC2_HOST }}
            EOF

            # Restrict .env permissions - readable by owner only
            chmod 600 .env

            # Write compose-specific vars to a separate file
            # Keeps deployment config out of the app's runtime environment
            cat <<'EOF' > .env.deploy
            ECR_REPO_URL=${{ secrets.ECR_REPOSITORY_URL }}
            ECR_REPOSITORY=${{ vars.ECR_REPOSITORY }}
            IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            EOF

            # Authenticate Docker daemon to ECR
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URL }}

            # Pull updated images and restart all services
            docker compose --env-file .env --env-file .env.deploy down || true
            docker compose --env-file .env --env-file .env.deploy pull
            docker compose --env-file .env --env-file .env.deploy up -d

            # Remove dangling images to prevent disk exhaustion
            docker image prune -f
